name: Publish

on:
  # A push rather than `pull_request: closed`, so the workflow that publishes
  # is always the copy on master. The `release` job then lets through only the
  # push that merged a release PR.
  push:
    branches: [master]
  # To retry a release that failed part-way.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Check that a release PR was merged
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.pr.outputs.merged }}
    steps:
      # A release PR is one from a `chore/release-` branch of this repository:
      # the one create-release-pr.yml opens, or one made by hand. A fork's
      # branch of the same name does not count.
      - name: Find the PR this push merged
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Started by hand."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"master\" and .head.repo.full_name == \"$REPO\")][0].head.ref // \"\"")
          case "$head" in
            chore/release-*)
              echo "This push merged the release PR from $head."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "This push did not merge a release PR (head: ${head:-none}), so nothing is published."
              echo "merged=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish:
    name: Publish unreleased versions
    needs: release
    if: needs.release.outputs.merged == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Tags each published version.
      contents: write
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Compared against the version npm prints rather than its exit status: a
      # registry error then reads as "not published", and the publish it leads
      # to is refused by npm instead of being silently skipped.
      - name: Find versions npm or git does not have
        id: pending
        run: |
          publish=""
          tag=""
          while read -r name version; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm"
            else
              echo "$name@$version is not on npm"
              publish="$publish $name"
            fi
            # A version published by hand, or by a run that failed before
            # tagging, still gets its tag.
            if git rev-parse -q --verify "refs/tags/$name@$version" >/dev/null; then
              echo "$name@$version is already tagged"
            else
              tag="$tag $name@$version"
            fi
          done < <(node scripts/release-versions.mjs)
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        if: steps.pending.outputs.publish != ''
        run: npm install -g npm@11

      # Both builds are tsc alone, and skipping install scripts keeps
      # dependency code from running in a job that can publish.
      - name: Install dependencies
        if: steps.pending.outputs.publish != ''
        run: npm ci --ignore-scripts

      # Each package's prepublishOnly rebuilds it, but the Redis backend
      # compiles against core's dist, so both are built in order first.
      - name: Build
        if: steps.pending.outputs.publish != ''
        run: npm run build

      # npm authenticates through each package's trusted publisher — this
      # workflow's OIDC token — so there is no npm token and no OTP.
      - name: Publish
        if: steps.pending.outputs.publish != ''
        env:
          PACKAGES: ${{ steps.pending.outputs.publish }}
        run: |
          for name in $PACKAGES; do
            npm publish -w "$name" --provenance
          done

      - name: Tag
        if: steps.pending.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.pending.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          for tag in $TAGS; do
            git tag -a "$tag" -m "$tag"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "$tag"
          done
